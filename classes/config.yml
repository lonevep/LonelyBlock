# ====================================================================
# LonelyBlock 自定义方块掉落插件 - 主配置文件
# 作者: lone_vep
# 适配版本: 1.8 ~ 26.2 (含中间所有版本)
# ====================================================================
# 配置说明:
#   - 所有向玩家发送的提示均在 lang.yml 中自定义 (控制台启动/关闭消息已内置代码)
#   - 方块配置在 blocks/ 文件夹下的 .yml 文件中定义
#   - 颜色代码使用 & 符号 (如 &c &a &e 等); 1.16+ 支持 HEX: &#FFAA00
#   - 物品库引用格式:
#       mm:物品ID      - 从 MythicMobs 物品库提取
#       ni:物品ID      - 从 NeigeItems 物品库提取
#       vanilla:物品ID - 原版物品 (如 vanilla:DIAMOND 或 vanilla:minecraft:diamond)
#   - 命令格式:
#       op:命令        - 以 OP 身份执行 (玩家权限组不变, 不会成为OP)
#       console:命令   - 以控制台身份执行
#   - 内置变量:
#       %player_name%   - 触发该指令的玩家ID
#       %player_uuid%   - 玩家UUID
#       %player_x/y/z%  - 玩家坐标
#       %player_world%  - 玩家所在世界
#       %block_x/y/z%   - 方块坐标
#       %block_world%   - 方块所在世界
#   - 数值随机值格式 (除掉落数量外, 所有数值字段均支持):
#       "5" / "5.5"            固定值
#       "1_5"                  随机范围 [1, 5], 默认 0 位小数
#       "1.5_5.5_2"            随机范围 [1.5, 5.5], 保留 2 位小数
#       "1.5_5.5_0"            随机范围 [1.5, 5.5], 保留 0 位小数 (整数)
#     掉落数量(amount)随机值格式 (整数): "3" 或 "1_5"
# ====================================================================

settings:
  # 是否开启调试模式 (会在控制台输出详细信息)
  debug: false
  # 是否需要 lonelyblock.use 权限才能触发方块掉落
  require-use-permission: false
  # PlaceholderAPI 扩展标识符 (本插件的自定义变量通过 %<标识符>_<变量名>% 暴露)
  # 例如设为 ll, 则变量 ll_level 可通过 %ll_level% 在其它插件中读取
  # 修改后需重启服务器生效
  papi-identifier: "ll"
  # 挖掘速率 lore 关键字 (读取工具 lore 中该关键字后的数字, 作为挖掘速率倍率)
  # 最终挖掘时间 = 方块配置的挖掘时间 / 挖掘速率倍率, 保留一位小数
  # 例如工具 lore 含 "挖掘速率: 1.2", 方块配置挖掘时间 10s -> 实际 10/1.2 = 8.3s
  # 关键字后的数字支持整数或小数 (如 1.2 / 2 / 0.5); 倍率 <= 0 时忽略不生效
  # 留空或不配置此项则不启用此功能 (工具 lore 不影响挖掘时间)
  mining-speed-lore: "挖掘速率"
  # 挖掘倍率 lore 关键字 (读取工具 lore 中该关键字后的数字, 作为掉落数量倍率)
  # 实际掉落数量 = 方块配置的掉落数量 × 挖掘倍率 (四舍五入取整, 原数量>0时保底1个)
  # 例如工具 lore 含 "挖掘倍率: 2.0", 方块配置掉落 1 个 -> 实际掉落 1×2 = 2 个
  # 关键字后的数字支持整数或小数 (如 2.0 / 2 / 1.5); 倍率 <= 0 时忽略不生效
  # 留空或不配置此项则不启用此功能 (掉落数量不受 lore 影响)
  mining-multiplier-lore: "挖掘倍率"
  # 注意: 挖掘速率 / 挖掘倍率 的判定只读取关键字后的第一个数字, 分隔符不限
  # 即 "挖掘速率: 1.2" / "挖掘速率=1.2" / "挖掘速率 1.2" 效果完全相同

# ====================================================================
# 自定义变量定义 - 由本插件管理的内部变量
# 变量名可包含字母/数字/下划线/连字符/中文, 如 ll_level
# 这些变量:
#   - 通过 PlaceholderAPI 暴露为 %<papi-identifier>_<变量名>% (需安装 PlaceholderAPI)
#   - 可在 blocks/*.yml 的 conditions / rewards / costs 中使用 (直接用变量名, 不需要 %)
#   - 按玩家存储, 持久化保存到 variables.yml
# ====================================================================
custom-variables:
  # 变量名: 默认值 (新玩家自动获得默认值)
  ll_level: 0
  mining_count: 0

# 注意:
#   - 玩家提示消息请编辑 lang.yml
#   - 方块配置请在 blocks/ 文件夹下创建 .yml 文件
